name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact_arch: x86_64
          - goarch: arm64
            artifact_arch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release pair
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="pr-${{ github.event.number }}-${GITHUB_SHA::7}"
          else
            version="${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}"
          fi
          version="${version//\//-}"
          package="waypoint_${version}_linux_${{ matrix.artifact_arch }}"
          mkdir -p "dist/${package}"

          go build -trimpath -ldflags "-s -w" -o "dist/${package}/waypoint" ./cmd/waypoint
          go build -trimpath -ldflags "-s -w" -o "dist/${package}/bash_init" ./cmd/bash-init

          cp README.md LICENSE NOTICE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-linux-${{ matrix.artifact_arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
